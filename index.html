<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTE Bond Gift Explorer</title>
    <style>
      :root {
        --bg: #0f1220;
        --panel: #171b2e;
        --panel2: #1e2338;
        --border: #2a3050;
        --text: #e8e9f3;
        --sub: #9aa0c0;
        --accent: #7c9bff;
        --accent2: #ffb454;
        --good: #6fe3a3;
        --row-hover: #232a47;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, sans-serif;
        background: linear-gradient(180deg, #0b0d18, #12162a 40%, #0b0d18);
        color: var(--text);
        min-height: 100vh;
        padding: 24px 16px 60px;
      }
      .wrap {
        max-width: 1260px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        margin-bottom: 20px;
      }
      header h1 {
        font-size: 26px;
        margin: 0 0 6px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-weight: 800;
      }
      header p {
        color: var(--sub);
        font-size: 13.5px;
        margin: 0;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        padding: 14px;
        border-radius: 14px;
        margin-bottom: 16px;
        align-items: center;
      }
      .controls .group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .controls label {
        font-size: 11px;
        color: var(--sub);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      select,
      input[type="text"] {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        min-width: 160px;
      }
      input[type="text"] {
        min-width: 220px;
      }
      select:focus,
      input:focus {
        border-color: var(--accent);
      }

      .sort-btns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-left: auto;
      }
      .sort-btns button {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 9px 14px;
        border-radius: 999px;
        font-size: 13px;
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
      }
      .sort-btns button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .sort-btns button.active {
        background: var(--accent);
        color: #0b0d18;
        border-color: var(--accent);
        font-weight: 700;
      }

      .stats {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 13px;
        color: var(--sub);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stat img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        border-radius: 6px;
        background: #0b0d18;
        flex-shrink: 0;
      }
      .stat b {
        color: var(--text);
        font-size: 14px;
        display: block;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      thead th {
        text-align: left;
        padding: 12px 14px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--sub);
        background: var(--panel2);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      thead th:hover {
        color: var(--accent);
      }
      thead th.sorted {
        color: var(--accent2);
      }
      tbody td {
        padding: 8px 14px;
        border-top: 1px solid var(--border);
        font-size: 14px;
        vertical-align: middle;
      }
      tbody tr:hover {
        background: var(--row-hover);
      }
      .char-cell {
        font-weight: 700;
        color: var(--accent2);
      }
      .gift-cell {
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .gift-icon {
        width: 40px;
        height: 40px;
        object-fit: contain;
        background: #0b0d18;
        border: 1px solid var(--border);
        border-radius: 8px;
        flex-shrink: 0;
        padding: 3px;
      }
      .gift-name {
        line-height: 1.25;
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
      }
      .badge.aff {
        background: rgba(111, 227, 163, 0.15);
        color: var(--good);
      }
      .badge.price {
        background: rgba(255, 180, 84, 0.12);
        color: var(--accent2);
      }
      .ratio {
        font-weight: 800;
        color: var(--accent);
      }
      .na {
        color: #5a6088;
        font-style: italic;
        font-size: 12.5px;
      }
      .source-cell {
        font-size: 12.5px;
        color: var(--sub);
        max-width: 220px;
      }

      footer {
        text-align: center;
        color: var(--sub);
        font-size: 12px;
        margin-top: 24px;
      }
      footer a {
        color: var(--accent);
        text-decoration: none;
      }

      ::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }

      .table-scroll {
        overflow-x: auto;
        border-radius: 14px;
      }
      @media (max-width: 640px) {
        .controls {
          flex-direction: column;
          align-items: stretch;
        }
        .sort-btns {
          margin-left: 0;
        }
        select,
        input[type="text"] {
          width: 100%;
          min-width: 0;
        }
        .source-cell {
          max-width: 140px;
        }
      }
    </style>
  </head>

        <p>
          ข้อมูลของขวัญ (Bond Gift) ของแต่ละตัวละคร — เรียงตาม Affection หรือ Affection ต่อ Fons ที่จ่าย
        </p>

      <div class="stats" id="stats"></div>

      <div class="controls">
        <div class="group">

        </div>
        <div class="group">

        <div class="group">

          </select>
        </div>
        <div class="sort-btns">
          <button data-sort="affection">⬇ Affection มาก→น้อย</button>
          <button data-sort="ratio">💎 คุ้มสุด (Affection/Fons)</button>
          <button data-sort="price">💰 ราคาน้อย→มาก</button>
          <button data-sort="character">🔤 ชื่อตัวละคร A→Z</button>
        </div>
      </div>

        <table>

              <th data-col="ratio" class="num">Affection / 1000 Fons</th>
              <th data-col="source">Where to Get</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <footer>อัปเดตล่าสุด 29 ก.ค. 2026</footer>
    </div>

      const rows = DATA.map(([character, gift, affection, price, source, image]) => ({
        character,
        gift,
        affection,
        price,
        source,
        image,
        ratio: affection != null && price != null && price > 0 ? (affection / price) * 1000 : null,
      }));

      // ---------- STATE ----------
      let state = { sortKey: "affection", sortDir: "desc", char: "", search: "", priceFilter: "all" };

      // ---------- INIT UI ----------
      const charFilter = document.getElementById("charFilter");
      const characters = [...new Set(rows.map((r) => r.character))].sort();
      characters.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        charFilter.appendChild(opt);
      });

      document.getElementById("searchBox").addEventListener("input", (e) => {
        state.search = e.target.value.toLowerCase();
        render();
      });
      charFilter.addEventListener("change", (e) => {
        state.char = e.target.value;
        render();
      });
      document.getElementById("priceFilter").addEventListener("change", (e) => {
        state.priceFilter = e.target.value;
        render();
      });

      document.querySelectorAll(".sort-btns button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.sort;
          if (state.sortKey === key) {
            state.sortDir = state.sortDir === "desc" ? "asc" : "desc";
          } else {
            state.sortKey = key;
            state.sortDir = "desc";
          }
          render();
        });
      });

      document.querySelectorAll("thead th[data-col]").forEach((th) => {
        th.addEventListener("click", () => {
          const key = th.dataset.col;
          if (!["character", "affection", "price", "ratio"].includes(key)) return;
          if (state.sortKey === key) {
            state.sortDir = state.sortDir === "desc" ? "asc" : "desc";
          } else {
            state.sortKey = key;
            state.sortDir = key === "character" ? "asc" : "desc";
          }
          render();
        });
      });

      function applyFilters(list) {
        return list.filter((r) => {
          if (state.char && r.character !== state.char) return false;
          if (
            state.search &&
            !r.gift.toLowerCase().includes(state.search) &&
            !r.character.toLowerCase().includes(state.search)
          )
            return false;
          if (state.priceFilter === "buyable" && r.price == null) return false;
          if (state.priceFilter === "free" && r.price != null) return false;
          return true;
        });
      }

      function applySort(list) {
        const key = state.sortKey;
        const dir = state.sortDir === "asc" ? 1 : -1;
        return [...list].sort((a, b) => {
          let av = a[key],
            bv = b[key];
          if (key === "character" || key === "gift") {
            return dir * String(av).localeCompare(String(bv));
          }
          const aNull = av == null,
            bNull = bv == null;
          if (aNull && bNull) return 0;
          if (aNull) return 1;
          if (bNull) return -1;
          return dir * (av - bv);
        });
      }

      function render() {
        const filtered = applyFilters(rows);
        const sorted = applySort(filtered);

        document.querySelectorAll(".sort-btns button").forEach((b) => {
          b.classList.toggle("active", b.dataset.sort === state.sortKey);
        });
        document.querySelectorAll("thead th[data-col]").forEach((th) => {
          th.classList.toggle("sorted", th.dataset.col === state.sortKey);
        });

        const tbody = document.getElementById("tbody");
        tbody.innerHTML = sorted
          .map(
            (r) => `
              <tr>
                <td class="char-cell">${r.character}</td>
                <td>
                  <div class="gift-cell">
                    <img class="gift-icon" src="${r.image}" alt="${r.gift}" loading="lazy" onerror="this.style.visibility='hidden'">
                    <span class="gift-name">${r.gift}</span>
                  </div>
                </td>
                <td class="num">${r.affection != null ? `<span class="badge aff">${r.affection}</span>` : `<span class="na">ไม่มีข้อมูล</span>`}</td>
                <td class="num">${r.price != null ? `<span class="badge price">${r.price.toLocaleString()}</span>` : `<span class="na">หาไม่ได้ด้วย Fons</span>`}</td>
                <td class="num">${r.ratio != null ? `<span class="ratio">${r.ratio.toFixed(1)}</span>` : `<span class="na">—</span>`}</td>
                <td class="source-cell">${r.source}</td>
              </tr>
            `,
          )
          .join("");

        const totalGifts = filtered.length;
        const buyable = filtered.filter((r) => r.price != null);
        const bestRatio = filtered.filter((r) => r.ratio != null).sort((a, b) => b.ratio - a.ratio)[0];
        const highestAff = filtered.filter((r) => r.affection != null).sort((a, b) => b.affection - a.affection)[0];

        document.getElementById("stats").innerHTML = `
          <div class="stat"><div><b>${totalGifts}</b>รายการของขวัญที่แสดง</div></div>
          <div class="stat"><div><b>${buyable.length}</b>รายการที่ซื้อด้วย Fons ได้</div></div>
          ${bestRatio ? `<div class="stat"><img src="${bestRatio.image}" onerror="this.style.display='none'"><div><b>${bestRatio.gift}</b>คุ้มสุด: ${bestRatio.ratio.toFixed(1)} Aff/1000 Fons (${bestRatio.character})</div></div>` : ""}
          ${highestAff ? `<div class="stat"><img src="${highestAff.image}" onerror="this.style.display='none'"><div><b>${highestAff.gift}</b>Affection สูงสุด: ${highestAff.affection} (${highestAff.character})</div></div>` : ""}
        `;
      }

      render();
    </script>
